<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Supervertaler for Word</title>
<script>
  // ?standalone opens the pane in a plain browser with a stand-in Word (standalone.js)
  document.write(location.search.includes("standalone")
    ? '<script src="standalone.js"><\/script>'
    : '<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"><\/script>');
</script>
<style>
  :root {
    --blue: #1f5fbf; --blue-soft: #e8f0fb; --ink: #1c1c1c; --muted: #6b6b6b;
    --line: #e1e1e1; --bg: #fafafa; --ok: #2e7d32; --warn: #b26a00; --hit: #fff3b0;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; font: 13px "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; padding: 6px 10px; background: #fff; border-bottom: 1px solid var(--line); min-height: 28px; }
  header .counts { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  section { border-bottom: 1px solid var(--line); background: #fff; }
  section h2 { margin: 0; padding: 6px 10px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; }
  section h2 .pill { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; }
  #segment { padding: 0 10px 10px; }
  #src { padding: 8px; background: var(--blue-soft); border-radius: 4px; min-height: 42px; line-height: 1.45; }
  #src.lens { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 2px 6px; row-gap: 6px; padding: 8px 8px 6px; }
  .lens .w { line-height: 1.4; }
  .lens .hit { display: inline-flex; flex-direction: column; align-items: flex-start; cursor: pointer; border-radius: 3px; padding: 0 2px; margin: 0 -2px; }
  .lens .hit:hover { background: #dbe7fa; }
  .lens .hit .ws { line-height: 1.4; border-bottom: 2px solid var(--blue); }
  .lens .hit .tt { font-size: 11.5px; color: var(--blue); font-weight: 600; white-space: nowrap; line-height: 1.3; margin-top: 2px; }
  .lens .hit.nt .ws { border-bottom-color: var(--warn); }
  .lens .hit.nt .tt { color: var(--warn); }
  .lens .hit .n { display: inline-block; min-width: 14px; height: 14px; line-height: 14px; text-align: center; font-size: 9.5px; font-weight: 700; color: #fff; background: var(--blue); border-radius: 7px; margin-left: 4px; vertical-align: 1px; }
  .lens .hit.nt .n { background: var(--warn); }
  .lens .hit .more { font-weight: 400; color: var(--muted); margin-left: 3px; }
  .lens .u.sel, .lens .hit.sel .ws { background: #ffd54f; border-radius: 2px; }
  .lens .u { cursor: text; }
  #pair { display: none; margin-top: 6px; border: 1px solid var(--blue); border-radius: 4px; background: var(--blue-soft); padding: 6px 8px; align-items: center; gap: 6px; font-size: 12px; }
  #pair.open { display: flex; flex-wrap: wrap; }
  #pair input { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 3px; min-width: 120px; flex: 1; background: #fff; }
  #pair .arrow { color: var(--muted); }
  #pair button { padding: 3px 10px; }
  #pair select { font: inherit; font-size: 12px; padding: 3px 4px; border: 1px solid var(--line); border-radius: 3px; background: #fff; max-width: 200px; }
  #pair .hint2 { color: var(--muted); font-size: 11px; width: 100%; }
  #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 6px 12px; border-radius: 4px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: .92; }
  #src.plain { display: block; line-height: 1.6; }
  #src.plain .u { display: inline; }
  #src.plain .hit { display: inline; padding: 0; margin: 0; }
  #src.plain .hit .ws { border-bottom: 0; background: var(--hit); padding: 0 2px; border-radius: 2px; }
  #src.plain .hit .n { display: inline-block; min-width: 13px; height: 13px; line-height: 13px; text-align: center; font-size: 9px; font-weight: 700; color: #fff; background: var(--blue); border-radius: 7px; margin-left: 2px; vertical-align: 2px; cursor: pointer; }
  #src.plain .hit.nt .n { background: var(--warn); }
  #src.plain .hit.sel .ws { background: #ffd54f; }
  .terms { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px 10px; }
  .term { border: 1px solid var(--line); border-radius: 12px; padding: 2px 8px; background: #fff; cursor: pointer; font-size: 12px; }
  .term:hover { border-color: var(--blue); }
  .term b { color: var(--blue); font-weight: 600; }
  .term.nt b { color: var(--warn); }
  .term .k { display: inline-block; min-width: 14px; height: 14px; line-height: 14px; text-align: center; font-size: 9.5px; font-weight: 700; color: #fff; background: var(--blue); border-radius: 7px; margin-right: 4px; }
  .term.nt .k { background: var(--warn); }
  .term .more { color: var(--muted); margin-left: 3px; }
  #termmode { font: inherit; font-size: 11px; color: var(--muted); border: 0; background: transparent; cursor: pointer; margin-right: 8px; }
  #picker { display: none; margin: 4px 0 0; border: 1px solid var(--line); border-radius: 4px; background: #fff; overflow: hidden; }
  #picker.open { display: block; }
  #picker div { display: flex; gap: 8px; padding: 4px 8px; cursor: pointer; border-top: 1px solid var(--line); }
  #picker div:first-child { border-top: 0; }
  #picker div:hover { background: var(--blue-soft); }
  #picker .k { min-width: 16px; color: var(--muted); font-size: 11px; }
  #picker b { color: var(--blue); font-weight: 600; }
  #picker .src { color: var(--muted); margin-left: auto; font-size: 11px; }
  #tgt { width: 100%; margin-top: 8px; min-height: 64px; padding: 8px; border: 1px solid var(--line); border-radius: 4px; font: inherit; line-height: 1.45; resize: vertical; }
  #tgt:focus { outline: 2px solid var(--blue); border-color: transparent; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .status { font-size: 12px; color: var(--muted); }
  .status.confirmed { color: var(--ok); }
  button { font: inherit; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--blue); background: var(--blue); color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: var(--blue); }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 11px; margin-left: auto; }
  #matches { flex: 0 0 auto; max-height: 40%; overflow: auto; }
  .tm { padding: 6px 10px; border-top: 1px solid var(--line); cursor: pointer; }
  .tm:hover { background: var(--blue-soft); }
  .tm .pct { display: inline-block; min-width: 38px; font-weight: 600; color: var(--blue); }
  .tm .pct.exact { color: var(--ok); }
  .tm .s { color: var(--muted); }
  .tm .s del { background: #fde2e2; text-decoration: line-through; color: #a33; }
  .tm .s ins { background: #dff5df; text-decoration: none; color: #1b5e20; }
  .tm .t { margin-top: 2px; }
  .tm .meta { font-size: 11px; color: var(--muted); }
  .terms { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px 10px; }
  .term { border: 1px solid var(--line); border-radius: 12px; padding: 2px 8px; background: #fff; cursor: pointer; font-size: 12px; }
  .term:hover { border-color: var(--blue); }
  .term b { color: var(--blue); font-weight: 600; }
  .term.nt b { color: var(--warn); }
  .empty { padding: 8px 10px; color: var(--muted); font-style: italic; }
  #grid { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th.n, td.n { width: 30px; } th.st, td.st { width: 20px; }
  td { overflow-wrap: anywhere; }
  th { position: sticky; top: 0; background: #f3f3f3; font-weight: 600; text-align: left; font-size: 11px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.35; }
  tr { cursor: pointer; }
  tr:hover td { background: var(--blue-soft); }
  tr.current td { background: var(--blue-soft); }
  tr.current td:first-child { box-shadow: inset 3px 0 0 var(--blue); }
  td.n { color: var(--muted); width: 28px; text-align: right; }
  td.st { width: 18px; text-align: center; }
  td.st.confirmed { color: var(--ok); }
  td.st.draft { color: var(--warn); }
  footer { padding: 4px 10px; font-size: 11px; color: var(--muted); background: #fff; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <span class="counts" id="counts"></span>
</header>
<main>
  <section id="segment">
    <h2>Segment <span class="pill"><select id="termmode" title="How termbase hits are shown"><option value="lens">Terms: lens</option><option value="chips">Terms: chips</option></select><span id="segid"></span></span></h2>
    <div id="src">Click into a sentence in the document.</div>
    <div id="picker"></div>
    <div id="pair">
      <input id="pair-src" placeholder="source term"><span class="arrow">&rarr;</span><input id="pair-tgt" placeholder="target term">
      <select id="pair-tb" title="Termbase the term goes to" hidden></select>
      <button id="pair-add">Add term</button><button id="pair-clear" class="ghost">Clear</button>
      <span class="hint2">Click words in the source to select them &middot; select the target here or on the page &middot; Ctrl+Shift+T adds</span>
    </div>
    <textarea id="tgt" placeholder="Target" spellcheck="true"></textarea>
    <div class="row">
      <button id="confirm" disabled>Confirm &amp; next</button>
      <button id="draftall" class="ghost">Draft all (mock)</button>
      <span class="status" id="status"></span>
      <span class="hint">Alt+1…9 inserts a term · Ctrl+Enter confirms</span>
    </div>
  </section>
  <section id="matches">
    <h2>Translation memory <span class="pill" id="tmcount"></span></h2>
    <div id="tmlist"><div class="empty">No segment selected.</div></div>
    <h2 id="tbhead" hidden>Termbase <span class="pill" id="tbcount"></span></h2>
    <div class="terms" id="terms" hidden></div>
  </section>
  <section id="grid">
    <table>
      <thead><tr><th class="n">#</th><th class="st"></th><th id="th-src">Source</th><th id="th-tgt">Target</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<div id="toast"></div>
<footer id="foot">Loading Office.js…</footer>

<script>
// ------------------------------------------------------------------ mock engine
// Stands in for the local engine (Workbench TM + termbase over localhost).
const MOCK_TM = [
  ["A mashup is a Web application that combines data from two or more sources.",
   "Een mashup is een webtoepassing die gegevens uit twee of meer bronnen combineert.", "Mashups_2024"],
  ["The term implies easy, fast integration, frequently done by access to open APIs.",
   "De term impliceert een eenvoudige, snelle integratie, vaak via toegang tot open API's.", "Mashups_2024"],
  ["An example of a mashup is the use of cartographic data to add location information to real estate data.",
   "Een voorbeeld van een mashup is het gebruik van cartografische gegevens om locatie-informatie toe te voegen aan vastgoedgegevens.", "Mashups_2024"],
  ["This creates a new and distinct Web service.",
   "Dit creëert een nieuwe en onderscheidende webdienst.", "Mashups_2024"],
];
const MOCK_TB = [
  ["mashup", ["mashup"], "nt"], ["Web application", ["webtoepassing", "webapplicatie"], ""],
  ["cartographic data", ["cartografische gegevens", "kaartgegevens"], ""],
  ["mapping program", ["kaarttoepassing", "kaartprogramma"], ""],
  ["Web service", ["webdienst"], ""], ["integration", ["integratie"], ""], ["data", ["gegevens", "data"], ""],
].map(([src, tgts, kind]) => ({src, tgts, kind}));
const MOCK_TM_C = MOCK_TM.map(([source, target, name]) => ({source, target, name}));

// ---- the local engine, when one is serving this page; otherwise the mock
let engine = null;
async function detectEngine() {
  try { const r = await fetch("/api/status", {cache: "no-store"}); if (r.ok) engine = await r.json(); } catch (e) { engine = null; }
}
const langs = () => ({src: record ? record.sourceLang : "", tgt: record ? record.targetLang : ""});
async function getTerms(text) {
  if (!engine) return MOCK_TB;
  const {src, tgt} = langs();
  const r = await fetch(`/api/terms?text=${encodeURIComponent(text)}&src=${src}&tgt=${tgt}`);
  return r.ok ? r.json() : [];
}
async function getTmCandidates(text) {
  if (!engine) return MOCK_TM_C;
  const {src, tgt} = langs();
  const r = await fetch(`/api/tm?text=${encodeURIComponent(text)}&src=${src}&tgt=${tgt}`);
  return r.ok ? r.json() : [];
}
const words = s => s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter(Boolean);
function lcs(a, b) {                      // word-level LCS table for diff + score
  const m = a.length, n = b.length, d = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--)
    d[i][j] = a[i] === b[j] ? d[i + 1][j + 1] + 1 : Math.max(d[i + 1][j], d[i][j + 1]);
  return d;
}
function fuzzy(source, cands) {
  const q = words(source);
  return cands.map(({source: s, target: t, name}) => {
    const w = words(s), d = lcs(q, w);
    const pct = Math.round(100 * 2 * d[0][0] / (q.length + w.length));
    // render TM source with words that differ from the current source marked
    let i = 0, j = 0, html = [];
    while (i < q.length || j < w.length) {
      if (i < q.length && j < w.length && q[i] === w[j]) { html.push(w[j]); i++; j++; }
      else if (j < w.length && (i >= q.length || d[i][j + 1] >= d[i + 1][j])) { html.push("<del>" + w[j] + "</del>"); j++; }
      else { html.push("<ins>" + q[i] + "</ins>"); i++; }
    }
    return {pct, s: html.join(" "), t, name};
  }).filter(m => m.pct >= 50).sort((a, b) => b.pct - a.pct).slice(0, 5);
}
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function termHits(source, terms) {
  const hits = [];
  for (const {src, tgts, kind} of terms) {
    const m = new RegExp("(?<![\\p{L}\\p{N}])" + reEsc(src) + "(?![\\p{L}\\p{N}])", "iu").exec(source);
    if (m) hits.push({src, tgts, kind, start: m.index, end: m.index + m[0].length});
  }
  hits.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const out = []; let last = -1;                    // drop overlaps, keep the earlier/longer
  for (const h of hits) if (h.start >= last) { out.push(h); last = h.end; }
  out.forEach((h, i) => h.n = i + 1);
  return out;
}
const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));

// ------------------------------------------------------------------ document
const NS = "urn:supervertaler:word:1", TAG = "sv:seg:";
const PLACEHOLDERS = new Set(["[empty segment]", "Click or tap here to enter text."]);
const liveText = t => PLACEHOLDERS.has((t || "").trim()) ? "" : t;
const sameText = (a, b) => (a || "").trim().toLowerCase() === (b || "").trim().toLowerCase();
const targetOf = (seg, live) => (seg && sameText(live, seg.source)) ? "" : live;
let gridOrder = null;            // segment ids in document order, ghosts removed

// Anchors as they sit on the page. A tracked move leaves a ghost behind (same
// tag, no live text) next to the live copy; the live copy wins.
async function documentOrder() {
  return Word.run(async ctx => {
    const ccs = ctx.document.contentControls;
    ccs.load("items/tag,items/text");
    await ctx.sync();
    const seen = new Map();                       // id -> {pos, text} of the chosen copy
    ccs.items.forEach((cc, pos) => {
      if (!cc.tag.startsWith(TAG)) return;
      const id = cc.tag.slice(TAG.length), text = liveText(cc.text);
      const cur = seen.get(id);
      if (!cur || (!cur.text && text)) seen.set(id, {pos, text});
    });
    return [...seen.entries()].sort((a, b) => a[1].pos - b[1].pos).map(([id]) => id);
  });
}
function liveControl(ccs) {      // pick the non-ghost among same-tag controls
  return ccs.find(c => liveText(c.text)) || ccs[0];
}
let record = null;               // {sourceLang, targetLang, segments:[{id,source,target,status,origin}]}
let currentId = null;
const $ = id => document.getElementById(id);

async function loadRecord() {
  await Word.run(async ctx => {
    const parts = ctx.document.customXmlParts.getByNamespace(NS);
    parts.load("items");
    await ctx.sync();
    if (!parts.items.length) { record = null; return; }
    const xml = parts.items[0].getXml();
    await ctx.sync();
    const doc = new DOMParser().parseFromString(xml.value, "text/xml");
    const root = doc.documentElement;
    record = {
      sourceLang: root.getAttribute("source_lang"), targetLang: root.getAttribute("target_lang"),
      segments: [...doc.getElementsByTagNameNS(NS, "segment")].map(el => ({
        id: el.getAttribute("id"), status: el.getAttribute("status") || "draft",
        origin: el.getAttribute("origin") || "",
        source: el.getElementsByTagNameNS(NS, "source")[0]?.textContent || "",
        target: el.getElementsByTagNameNS(NS, "target")[0]?.textContent || "",
      })),
    };
  });
}

function recordXml() {
  const x = new XMLSerializer(), d = document.implementation.createDocument(NS, "sv:project");
  const root = d.documentElement;
  root.setAttribute("source_lang", record.sourceLang); root.setAttribute("target_lang", record.targetLang);
  for (const s of record.segments) {
    const el = d.createElementNS(NS, "sv:segment");
    el.setAttribute("id", s.id); el.setAttribute("status", s.status);
    el.setAttribute("origin", s.origin); el.setAttribute("match", "0");
    const so = d.createElementNS(NS, "sv:source"); so.textContent = s.source;
    const ta = d.createElementNS(NS, "sv:target"); ta.textContent = s.target;
    el.append(so, ta); root.appendChild(el);
  }
  return x.serializeToString(d);
}

async function saveRecord(ctx) {
  const parts = ctx.document.customXmlParts.getByNamespace(NS);
  parts.load("items");
  await ctx.sync();
  for (const p of parts.items) p.delete();
  ctx.document.customXmlParts.add(recordXml());
  await ctx.sync();
}

async function currentSegment() {
  return Word.run(async ctx => {
    const sel = ctx.document.getSelection();
    sel.load("text");
    let cc = sel.parentContentControlOrNullObject;
    cc.load("isNullObject,tag,title,text");
    const inside = sel.contentControls;               // controls wholly within the selection
    inside.load("items/tag,items/title,items/text");
    await ctx.sync();
    if (cc.isNullObject && inside.items.length === 1) cc = inside.items[0];
    if (cc.isNullObject || !cc.tag.startsWith(TAG)) return null;
    return {id: cc.tag.slice(TAG.length), title: cc.title, text: liveText(cc.text), selText: sel.text};
  });
}

async function selectSegment(id) {
  await Word.run(async ctx => {
    const ccs = ctx.document.contentControls.getByTag(TAG + id);
    ccs.load("items/text");
    await ctx.sync();
    if (ccs.items.length) { liveControl(ccs.items).select("Select"); await ctx.sync(); }
  });
}

async function writeBack(id, target, status) {
  await Word.run(async ctx => {
    ctx.document.changeTrackingMode = Word.ChangeTrackingMode.trackAll;
    const ccs = ctx.document.contentControls.getByTag(TAG + id);
    ccs.load("items/text");
    await ctx.sync();
    if (!ccs.items.length) return;
    const cc = liveControl(ccs.items);
    // Replace only the LIVE text. Replacing the whole control would also sweep
    // up the hidden deleted source and re-attribute that deletion to the user.
    const changes = cc.getRange().getTrackedChanges();
    changes.load("items/type");
    await ctx.sync();
    const insertions = changes.items.filter(c => c.type === "Added");
    const hasDeletion = changes.items.some(c => c.type === "Deleted");
    if (!hasDeletion) {
      cc.insertText(target, "Replace");          // first translation: source becomes the deletion
    } else {
      cc.insertText(target, "Start");            // new target in front...
      for (const ins of insertions) ins.getRange().delete();   // ...old live text out
    }
    cc.title = status;
    const seg = record.segments.find(s => s.id === id);
    if (seg) { seg.target = target; seg.status = status; seg.origin = "human"; }
    await saveRecord(ctx);
  });
}

// ------------------------------------------------------------------ UI
function renderCounts() {
  if (!record) { $("counts").textContent = ""; return; }
  const n = record.segments.length, c = record.segments.filter(s => s.status === "confirmed").length;
  $("counts").textContent = `${c} / ${n} confirmed`;
}

function renderGrid() {
  const tb = $("rows"); tb.innerHTML = "";
  if (!record) { tb.innerHTML = '<tr><td colspan="4" class="empty">No Supervertaler record in this document.</td></tr>'; return; }
  const byId = new Map(record.segments.map(s => [s.id, s]));
  const rows = gridOrder ? gridOrder.map(id => byId.get(id)).filter(Boolean) : record.segments;
  rows.forEach((s, i) => {
    const tr = document.createElement("tr");
    tr.dataset.id = s.id;
    if (s.id === currentId) tr.className = "current";
    const glyph = s.status === "confirmed" ? "✓" : (s.target ? "✎" : "○");
    tr.innerHTML = `<td class="n">${i + 1}</td><td class="st ${s.status}">${glyph}</td>` +
                   `<td>${esc(s.source)}</td><td>${esc(s.target)}</td>`;
    tr.onclick = () => selectSegment(s.id);
    tb.appendChild(tr);
  });
  const cur = tb.querySelector("tr.current");
  if (cur) cur.scrollIntoView({block: "center"});     // keep the current row mid-grid
}

let lensHits = [], renderToken = 0;
function termMode() { try { return localStorage.getItem("sv.termmode") || "lens"; } catch (e) { return "lens"; } }
function renderLens(source, hits) {
  lensHits = hits;
  const mode = termMode();
  const box = $("src"); box.className = mode === "lens" ? "lens" : "lens plain"; box.innerHTML = "";
  let pos = 0;
  let unit = 0;
  const mkUnit = (el, text) => { el.dataset.u = unit++; el.dataset.t = text; el.classList.add("u"); el.addEventListener("click", ev => { ev.stopPropagation(); lensClick(+el.dataset.u); }); };
  const words = (text) => { for (const w of text.split(/(\s+)/)) {
    if (!w) continue;
    if (!w.trim()) { if (mode !== "lens") box.appendChild(document.createTextNode(w)); continue; }   // plain mode keeps the spaces
    const el = document.createElement("span"); el.className = "w"; el.textContent = w; mkUnit(el, w); box.appendChild(el); } };
  for (const h of hits) {
    words(source.slice(pos, h.start));
    const el = document.createElement("span");
    el.className = "hit" + (h.kind === "nt" ? " nt" : "");
    if (mode === "lens") {
      el.innerHTML = `<span class="ws">${esc(source.slice(h.start, h.end))}</span>` +
        `<span class="tt">${esc(h.tgts[0])}${h.kind === "nt" ? " · NT" : ""}<span class="n">${h.n}</span>` +
        (h.tgts.length > 1 ? `<span class="more">+${h.tgts.length - 1}</span>` : "") + `</span>`;
      el.querySelector(".tt").onclick = ev => { ev.stopPropagation(); h.tgts.length > 1 ? openPicker(h) : insertTerm(h.tgts[0]); };
    } else {
      el.innerHTML = `<span class="ws">${esc(source.slice(h.start, h.end))}</span><span class="n" title="${esc(h.tgts[0])}">${h.n}</span>`;
      el.querySelector(".n").onclick = ev => { ev.stopPropagation(); h.tgts.length > 1 ? openPicker(h) : insertTerm(h.tgts[0]); };
    }
    const ws = el.querySelector(".ws"); mkUnit(ws, source.slice(h.start, h.end));
    box.appendChild(el);
    pos = h.end;
  }
  words(source.slice(pos));
  closePicker();
  lensSel = null; renderLensSel();
  renderChips(hits, mode);
}
function renderChips(hits, mode) {
  const show = mode === "chips" && hits.length > 0;
  $("tbhead").hidden = !show; $("terms").hidden = !show;
  if (!show) return;
  $("tbcount").textContent = `${hits.length} term${hits.length > 1 ? "s" : ""}`;
  $("terms").innerHTML = hits.map(h =>
    `<span class="term ${h.kind}"><span class="k">${h.n}</span>${esc(h.src)} → <b>${esc(h.tgts[0])}</b>${h.kind === "nt" ? " · NT" : ""}` +
    (h.tgts.length > 1 ? `<span class="more">+${h.tgts.length - 1}</span>` : "") + `</span>`).join("");
  [...$("terms").children].forEach((el, i) => { const h = hits[i]; el.onclick = () => h.tgts.length > 1 ? openPicker(h) : insertTerm(h.tgts[0]); });
}

// ---- term pair: a remembered source selection + a remembered target selection
let lensSel = null, tgtSel = "";
function lensUnits() { return [...$("src").querySelectorAll(".u")]; }
function lensClick(i) {
  if (lensSel && i >= lensSel.a && i <= lensSel.b) lensSel = null;
  else if (lensSel) lensSel = {a: Math.min(lensSel.a, i), b: Math.max(lensSel.b, i)};
  else lensSel = {a: i, b: i};
  renderLensSel();
}
function lensSelText() {
  if (!lensSel) return "";
  return lensUnits().filter(u => +u.dataset.u >= lensSel.a && +u.dataset.u <= lensSel.b).map(u => u.dataset.t).join(" ").replace(/[.,;:!?]+$/, "");
}
function renderLensSel() {
  for (const u of lensUnits()) {
    const on = !!(lensSel && +u.dataset.u >= lensSel.a && +u.dataset.u <= lensSel.b);
    u.classList.toggle("sel", on);
    if (u.classList.contains("ws")) u.parentElement.classList.toggle("sel", on);
  }
  renderPair();
}
function setTargetSel(text) { tgtSel = (text || "").trim().replace(/[.,;:!?]+$/, ""); renderPair(); }
function renderPair() {
  const src = lensSelText(), p = $("pair");
  if (!src && !tgtSel) { p.className = ""; return; }
  if (document.activeElement !== $("pair-src")) $("pair-src").value = src;
  if (document.activeElement !== $("pair-tgt")) $("pair-tgt").value = tgtSel;
  p.className = "open";
}
function clearPair() { lensSel = null; tgtSel = ""; renderLensSel(); $("pair").className = ""; }
function addTermPair() {
  const src = $("pair-src").value.trim(), tgt = $("pair-tgt").value.trim();
  if (!src || !tgt) { toast("Select a source term and a target term first"); return; }
  if (engine) {
    const {src: sl, tgt: tl} = langs();
    fetch("/api/terms", {method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({src, tgt, src_lang: sl, tgt_lang: tl, termbase_id: $("pair-tb").value})})
      .then(r => r.json()).then(r => toast(r.ok ? `Added to ${r.termbase}: ${src} → ${tgt}` : "Not added: " + (r.error || "")))
      .catch(() => toast("Not added: engine unreachable"));
  } else {
    const existing = MOCK_TB.find(t => t.src.toLowerCase() === src.toLowerCase());
    if (existing) { if (!existing.tgts.includes(tgt)) existing.tgts.push(tgt); } else MOCK_TB.push({src, tgts: [tgt], kind: ""});
  }
  if (!engine) toast("Added: " + src + " \u2192 " + tgt);
  clearPair();
  const seg = record && record.segments.find(x => x.id === currentId);
  if (seg) { const keep = $("tgt").value; renderSegment(seg, keep); }
}
let toastTimer = null;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.className = "show"; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "", 1800); }

let pickerFor = null;
function openPicker(h) {
  if (pickerFor === h) { closePicker(); return; }      // second click folds it away
  pickerFor = h;
  const p = $("picker");
  p.innerHTML = h.tgts.map((t, i) => `<div data-t="${esc(t)}"><span class="k">${String.fromCharCode(97 + i)}</span><b>${esc(t)}</b><span class="src">${esc(h.src)} · mock</span></div>`).join("");
  for (const row of p.children) row.onclick = () => { insertTerm(row.dataset.t); closePicker(); };
  p.className = "open";
}
function closePicker() { pickerFor = null; $("picker").className = ""; $("picker").innerHTML = ""; }
function insertTerm(text) { insertAtCursor($("tgt"), text); }
document.addEventListener("keydown", e => {
  if (e.altKey && e.key >= "1" && e.key <= "9") {
    const h = lensHits[+e.key - 1];
    if (h) { e.preventDefault(); h.tgts.length > 1 && e.shiftKey ? openPicker(h) : insertTerm(h.tgts[0]); }
  }
  if (e.key === "Escape") { closePicker(); clearPair(); }
});

function renderSegment(seg, live) {
  $("segid").textContent = seg ? seg.id : "";
  $("confirm").disabled = !seg;
  if (!seg) {
    $("src").className = ""; $("src").textContent = "Click into a sentence in the document.";
    $("tbhead").hidden = true; $("terms").hidden = true;
    closePicker();
    $("tgt").value = ""; $("status").textContent = "";
    $("tmlist").innerHTML = '<div class="empty">No segment selected.</div>';
    $("tmcount").textContent = "";
    return;
  }
  renderLens(seg.source, []);
  $("segid").textContent = seg.id;
  $("tgt").value = live ?? seg.target;
  $("status").textContent = seg.status + (seg.origin ? " · " + seg.origin : "");
  $("status").className = "status " + seg.status;
  $("tmcount").textContent = ""; $("tmlist").innerHTML = '<div class="empty">Looking up…</div>';

  const token = ++renderToken;
  getTerms(seg.source).then(terms => {
    if (token !== renderToken) return;
    const hits = termHits(seg.source, terms);
    renderLens(seg.source, hits);
    $("segid").textContent = (hits.length ? `${hits.length} term${hits.length > 1 ? "s" : ""} · ` : "") + seg.id;
  });
  getTmCandidates(seg.source).then(cands => {
    if (token !== renderToken) return;
    const tm = fuzzy(seg.source, cands);
    $("tmcount").textContent = tm.length ? `${tm.length} match${tm.length > 1 ? "es" : ""}` : "";
    $("tmlist").innerHTML = tm.length ? tm.map(m =>
      `<div class="tm" data-t="${esc(m.t)}"><span class="pct ${m.pct === 100 ? "exact" : ""}">${m.pct}%</span>` +
      `<span class="s">${m.s}</span><div class="t">${esc(m.t)}</div><div class="meta">${esc(m.name)}</div></div>`).join("")
      : '<div class="empty">No TM match.</div>';
    for (const el of $("tmlist").querySelectorAll(".tm")) el.onclick = () => { $("tgt").value = el.dataset.t; $("tgt").focus(); };
  });
}

function insertAtCursor(ta, text) {
  const a = ta.selectionStart, b = ta.selectionEnd;
  ta.value = ta.value.slice(0, a) + text + ta.value.slice(b);
  ta.selectionStart = ta.selectionEnd = a + text.length; ta.focus();
}

// Live mirror. While the cursor is in a segment, Word's text is polled and the
// target box follows it, unless the translator is typing in the box. Word is
// the truth; the pane writes to Word only on Confirm.
let mirrorTimer = null, lastWordText = null, mirrorBusy = false;
async function readCurrentText(id) {
  return Word.run(async ctx => {
    const ccs = ctx.document.contentControls.getByTag(TAG + id);
    ccs.load("items/text");
    await ctx.sync();
    return ccs.items.length ? liveText(liveControl(ccs.items).text) : null;
  });
}
async function mirrorTick() {
  if (!currentId || mirrorBusy) return;
  mirrorBusy = true;
  try {
    const text = await readCurrentText(currentId);
    if (text !== null && text !== lastWordText) {
      lastWordText = text;
      const seg = record && record.segments.find(s => s.id === currentId);
      const tgt = targetOf(seg, text);
      if (seg && seg.target !== tgt) {
        seg.target = tgt; seg.dirty = true;
        const cell = $("rows").querySelector(`tr[data-id="${currentId}"] td:last-child`);
        if (cell) cell.textContent = tgt;
      }
      if (document.activeElement !== $("tgt")) $("tgt").value = tgt;
    }
  } catch (e) { /* segment vanished mid-tick; the next selection change sorts it out */ }
  finally { mirrorBusy = false; }
}
function startMirror() { stopMirror(); lastWordText = null; mirrorTimer = setInterval(mirrorTick, 500); }
function stopMirror() { if (mirrorTimer) clearInterval(mirrorTimer); mirrorTimer = null; }
async function flushRecord() {
  // called when leaving a segment: persist what Word said while we were there
  if (record && record.segments.some(s => s.dirty)) {
    record.segments.forEach(s => delete s.dirty);
    await Word.run(saveRecord);
    renderCounts();
  }
}

async function onSelectionChanged() {
  try {
    const cur = await currentSegment();
    const id = cur ? cur.id : null;
    if (cur && id === currentId && cur.selText && cur.selText.trim() && cur.selText !== cur.text) setTargetSel(cur.selText);
    // Sticky segment: a click on a picture, a blank line or a gap between
    // segments keeps the current segment in the pane; only entering another
    // segment switches.
    if (id === null && currentId !== null) return;
    if (id !== currentId) {
      stopMirror();
      await flushRecord();
      gridOrder = await documentOrder();
      currentId = id;
      const seg = record && record.segments.find(s => s.id === id);
      renderSegment(seg || null, cur ? targetOf(seg, cur.text) : undefined);
      renderGrid();
      if (id) { lastWordText = cur.text; startMirror(); }
    }
  } catch (e) { $("foot").textContent = "Error: " + e.message; }
}

async function confirmAndNext() {
  if (!currentId || !record) return;
  const order = gridOrder || record.segments.map(s => s.id);
  const id = currentId, idx = order.indexOf(id);
  stopMirror();
  await writeBack(id, $("tgt").value.trim(), "confirmed");
  renderCounts();
  const next = record.segments.find(s => s.id === order[idx + 1]);
  if (next) {
    await selectSegment(next.id);
    currentId = next.id; renderSegment(next); renderGrid();
    lastWordText = next.target; startMirror();
    $("tgt").focus();
  } else { currentId = null; renderSegment(null); renderGrid(); }
}

async function draftAll() {
  // Mock of "draft the whole document": the real button calls the local engine.
  if (!record) return;
  $("draftall").disabled = true;
  for (const s of record.segments) {
    if (s.status === "confirmed") continue;
    const best = fuzzy(s.source, await getTmCandidates(s.source))[0];
    if (best) await writeBack(s.id, best.t, "draft");
  }
  $("draftall").disabled = false;
  renderCounts(); renderGrid();
}

Office.onReady(async info => {
  if (info.host !== Office.HostType.Word) { $("foot").textContent = "Open this pane in Word."; return; }
  await detectEngine();
  if (engine && engine.termbases && engine.termbases.length) {
    const sel = $("pair-tb"), proj = engine.project_termbase;
    const rest = engine.termbases.filter(t => !proj || t.id !== proj.id).sort((a, b) => a.name.localeCompare(b.name));
    sel.innerHTML = (proj ? [proj] : []).concat(rest).map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
    sel.hidden = false;
  }
  await loadRecord();
  gridOrder = await documentOrder();
  if (record) {
    $("tgt").lang = record.targetLang; $("src").lang = record.sourceLang;
    const names = new Intl.DisplayNames(["en-GB"], {type: "language"});
    const name = code => { try { return names.of(code); } catch (e) { return code; } };
    $("th-src").textContent = name(record.sourceLang);
    $("th-tgt").textContent = name(record.targetLang);
    $("tgt").placeholder = name(record.targetLang);
  }
  renderCounts(); renderGrid();
  Office.context.document.addHandlerAsync(Office.EventType.DocumentSelectionChanged, onSelectionChanged);
  $("termmode").value = termMode();
  $("termmode").onchange = () => {
    try { localStorage.setItem("sv.termmode", $("termmode").value); } catch (e) {}
    const seg = record && record.segments.find(x => x.id === currentId);
    if (seg) renderSegment(seg, $("tgt").value);
  };
  $("confirm").onclick = confirmAndNext;
  $("draftall").onclick = draftAll;
  $("tgt").addEventListener("keydown", e => { if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); confirmAndNext(); } });
  const grab = () => { const t = $("tgt"); if (t.selectionEnd > t.selectionStart) setTargetSel(t.value.slice(t.selectionStart, t.selectionEnd)); };
  $("tgt").addEventListener("mouseup", grab);
  $("tgt").addEventListener("keyup", e => { if (e.shiftKey || e.key.startsWith("Arrow")) grab(); });
  $("pair-add").onclick = addTermPair; $("pair-clear").onclick = clearPair;
  for (const id of ["pair-src", "pair-tgt"]) $(id).addEventListener("keydown", e => { if (e.key === "Enter") addTermPair(); });
  document.addEventListener("keydown", e => { if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "t") { e.preventDefault(); addTermPair(); } });
  const engineNote = engine
    ? `engine: ${engine.termbases.map(t => t.name).join(", ")} (${engine.terms.toLocaleString()} terms) · TM ${engine.tm_units.toLocaleString()} units`
    : "no engine · matches are a mock";
  $("foot").textContent = record ? `${record.sourceLang} → ${record.targetLang} · ${engineNote}`
                                 : "This document has no Supervertaler record yet.";
  onSelectionChanged();
});
</script>
</body>
